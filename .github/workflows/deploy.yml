name: Deploy Next.js (estático) a EC2

on:
  push:
    branches: [prod15]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: ["", "_2"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets[format('EC2_SSH_KEY{0}', matrix.server)] }}" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -H ${{ secrets[format('EC2_HOST{0}', matrix.server)] }} >> ~/.ssh/known_hosts

      - name: Copiar out/ a EC2
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/key.pem" \
            ./out/ ${{ secrets[format('EC2_USER{0}', matrix.server)] }}@${{ secrets[format('EC2_HOST{0}', matrix.server)] }}:/var/www/html/